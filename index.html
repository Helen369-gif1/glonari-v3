<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
  // Device gate (PRODUCT_REQUIREMENTS.md §19 / DEVELOPMENT_PLAN.md
  // Stage 14): this desktop scene and mobile/index.html's static tap-zone
  // scene are two independent entry points with no shared layout — a
  // narrow/portrait viewport must never load this page's parallax scene
  // at all, not just render it awkwardly. Runs synchronously, as the
  // very first thing after <meta viewport> (so the media query already
  // sees the real device width, not a pre-viewport-meta default) and
  // before any stylesheet/asset below is requested, so a phone-sized
  // viewport never fetches this page's desktop assets before leaving.
  // 767px matches this project's own established mobile breakpoint (see
  // Stage 14's history). .replace(), not .href, so the redirect doesn't
  // leave a back-button entry that would just bounce the user right
  // back here into another redirect.
  //
  // Live re-check (2026-08-25, later still): the one-time check above
  // only ever runs once, at load — it never catches a viewport that
  // narrows to mobile width AFTER this page has already loaded (a manual
  // browser-window resize, an orientation change, or a backgrounded tab
  // resuming at a different size), so a desktop-loaded page left open
  // through one of those never left. `MediaQueryList`'s own 'change'
  // event exists exactly for this — it fires only when `matches` itself
  // flips, not on every resize tick, so it's used here instead of a
  // manual `resize` listener; the SAME MediaQueryList object is reused
  // for both the one-time check and this listener, rather than
  // constructing a second one for the same query.

  // sessionStorage can throw (storage blocked, some private modes); every
  // access goes through this, and a failure reads as "nothing stored", so
  // the page then behaves like a first visit.
  function glonariSession(method, key, value) {
    try {
      return sessionStorage[method](key, value);
    } catch (e) {
      return null;
    }
  }

  // Returning to the Campus (2026-10-12): the opening video (2026-10-14:
  // campus-opening.mp4; it replaced the branded intro overlay + the old
  // intro video) is only for a fresh entry. A browser Back/Forward to
  // this page, or arriving from one of the sub-sites (their "← Glonari"
  // back link, or any link out of meet-gia/, digital-banker/,
  // global-dream/, global-reserve/), lands straight in the Campus loop.
  // Same-origin referrer only, so an outside link still gets the opening,
  // and a manual reload (which keeps the old referrer) still shows it —
  // unless it was already shown in this tab (see `glonari.openingSeen`
  // in the next script).
  function glonariReturningToCampus() {
    try {
      var nav = performance.getEntriesByType('navigation')[0];
      if (nav && nav.type === 'back_forward') return true;
      if ((nav && nav.type === 'reload') || !document.referrer) return false;
      var ref = new URL(document.referrer);
      return ref.origin === location.origin &&
        /\/(meet-gia|digital-banker|global-dream|global-reserve)\//.test(ref.pathname);
    } catch (e) {
      return false;
    }
  }

  // Narrow-aspect gate (2026-10-13): the desktop Campus is now a pure
  // "cover" with no blurred backdrop, so any window narrower than 3:2
  // (portrait, square, 4:3, 5:4) would crop buildings off its sides —
  // those go to mobile/ too. "not all and (min-aspect-ratio: 3/2)" is a
  // strict "< 3/2", so an exact 3:2 window stays here, and
  // mobile/index.html's reverse gate is its exact negation (no ping-pong
  // at the boundary).
  var mobileQuery = window.matchMedia('(max-width: 767px), not all and (min-aspect-ratio: 3/2)');

  function goMobile() {
    window.location.replace('mobile/index.html');
  }

  if (mobileQuery.matches) {
    // A returning visit forwarded to mobile carries its "skip the intro"
    // decision along (since 2026-10-14 mobile/ plays the same opening
    // video and skips it on this marker): after .replace() the mobile page
    // only sees this page as its referrer and a plain 'navigate' type.
    if (glonariReturningToCampus()) glonariSession('setItem', 'glonariSkipIntro', '1');
    goMobile();
  } else {
    var pendingMobileRedirect = null;
    mobileQuery.addEventListener('change', function (event) {
      if (pendingMobileRedirect) {
        clearTimeout(pendingMobileRedirect);
        pendingMobileRedirect = null;
      }
      if (!event.matches) return; // only react to crossing INTO mobile width
      // Debounced (300ms): guards against a transient/flickering match —
      // DevTools device-emulation toggling, or the brief instant of
      // unstable `innerWidth` some mobile browsers report mid
      // orientation-change — by requiring the narrow state to still hold
      // once the delay elapses, rather than acting on the very first
      // 'change' event.
      pendingMobileRedirect = setTimeout(function () {
        if (mobileQuery.matches) {
          // One-shot marker consumed by mobile/index.html's own inline
          // <head> script — this call site is the LIVE resize/orientation
          // redirect, not the initial synchronous check above, so the
          // destination page must not replay the opening video (see
          // mobile/index.html). Set immediately before the
          // existing goMobile() call; goMobile() itself and the redirect
          // criteria are unchanged.
          glonariSession('setItem', 'glonariSkipIntro', '1');
          goMobile();
        }
      }, 300);
    });
  }
</script>
<script>
  // Opening video (2026-10-14, DEVELOPMENT_PLAN.md Stage 19): a fresh
  // entry plays assets/campus/campus-opening.mp4 straight away (no splash
  // screen, no click), then hands off to the loop — see main.js.
  // `opening-pending` on <html> is what makes styles.css show the opening
  // layer (with its poster) from the very first paint.
  //
  // It is skipped — straight into the loop — when:
  //  - the one-shot marker below is set: only by the automatic
  //    live-redirect from mobile/ (consumed here, once);
  //  - returning to the Campus (see glonariReturningToCampus above);
  //  - it was already shown in this tab's session (2026-10-14, later):
  //    main.js sets `glonari.openingSeen` once the opening has handed off
  //    to the loop or a fallback skipped it, so a reload or an outside
  //    link in the same tab no longer replays it; a new tab plays it.
  //
  // Nothing here runs when the first script is already redirecting to
  // mobile/: the "skip the intro" marker it just set for mobile/ must
  // survive (a browser that keeps parsing after location.replace() would
  // otherwise consume it again right here), and no
  // desktop image is preloaded for a page that is leaving. The still and
  // the poster are preloaded from here rather than from <link> tags for
  // that reason.
  function glonariPreload(href, priority) {
    var link = document.createElement('link');
    link.rel = 'preload';
    link.as = 'image';
    link.href = href;
    if (priority) link.fetchPriority = priority;
    document.head.appendChild(link);
  }

  if (!mobileQuery.matches) {
    if (glonariSession('getItem', 'glonariSkipIntro')) {
      glonariSession('removeItem', 'glonariSkipIntro');
    } else if (!glonariReturningToCampus() && glonariSession('getItem', 'glonari.openingSeen') !== '1') {
      document.documentElement.classList.add('opening-pending');
      glonariPreload('assets/campus/campus-opening-poster.webp', 'high');
    }
    glonariPreload('assets/campus/campus-still.webp');
  }
</script>
<title>Glonari Global Scene</title>
<link rel="stylesheet" href="design-tokens.css">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="campus-zones.css">
<link rel="stylesheet" href="section-modal.css">
</head>
<body>
  <!-- Campus scene (2026-10-13, replaces the layered parallax scene —
       see DEVELOPMENT_PLAN.md Stage 19 / PRODUCT_REQUIREMENTS.md §29).
       .campus is a fixed 16:9 box (the video frame; video is 1920x1080) sized
       in styles.css (pure cover, always fills the window); the videos AND the SVG
       hotspots are children of that same box, so the hotspots, drawn in
       a 1280x720 coordinate space (viewBox; the 1920x1080 video scales
       into it), stay locked onto the
       buildings at any window size. The camera never moves in the loop,
       so the shapes never have to. -->
  <div class="stage-viewport">
  <div class="campus" id="campus">
    <img class="campus__still" alt="" width="1920" height="1080">
    <video class="campus__loop" muted loop playsinline preload="auto" aria-hidden="true"></video>
    <video class="campus__opening" muted playsinline preload="auto" aria-hidden="true"></video>
    <script>
      // Every src/poster of the Campus media is set here, synchronously
      // while the page is parsed (so they load just as early as plain
      // attributes would), and only when this page is staying on desktop:
      // the browser's preload scanner fetches plain src=/poster=
      // attributes even on a page that is already redirecting to mobile/.
      // The opening is set up only on a fresh entry (`opening-pending`);
      // otherwise the element is dropped and its file is never fetched,
      // and the loop starts from its first frame over the still.
      (function (opening) {
        if (mobileQuery.matches) return;
        var campus = opening.parentNode;
        var loop = campus.querySelector('.campus__loop');
        campus.querySelector('.campus__still').src = 'assets/campus/campus-still.webp';
        loop.poster = 'assets/campus/campus-still.webp';
        loop.src = 'assets/campus/campus-loop.mp4';
        if (document.documentElement.classList.contains('opening-pending')) {
          opening.poster = 'assets/campus/campus-opening-poster.webp';
          opening.src = 'assets/campus/campus-opening.mp4';
        } else {
          opening.remove();
        }
      })(document.currentScript.previousElementSibling);
    </script>
    <!-- The 11 hotspots (SVG in the 1280x720 viewBox) are written right here by
         campus-zones.js — one source shared with mobile/index.html (2026-10-14,
         DEVELOPMENT_PLAN.md Stage 20). The generated markup is identical to the
         inline <svg> that used to sit here. -->
    <script src="campus-zones.js" data-base=""></script>
  </div>
  <!-- Hover/focus name tag: outside .campus so its edge fade never dims it. -->
  <div class="campus__label" aria-hidden="true"><span class="campus__label-name"></span></div>
  </div>

  <!-- Section modal: unchanged; sibling of .stage-viewport. -->
  <div id="modal-overlay">
    <div id="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-desc">
      <h2 id="modal-title"></h2>
      <p id="modal-desc"></p>
      <button id="modal-close" type="button">Close</button>
    </div>
  </div>

  <div class="explore-hint" aria-hidden="true">
    <span class="explore-hint__text">Explore</span>
  </div>

  <div class="cursor-dot" aria-hidden="true"></div>
  <div class="cursor-ring" aria-hidden="true"></div>

  <!-- Cross-project navigation fade (Digital Banker, Meet Gia). -->
  <div id="exit-transition" aria-hidden="true"></div>

  <script src="section-modal.js" defer></script>
  <script src="main.js" defer></script>
</body>
</html>
