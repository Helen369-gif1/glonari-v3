<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <script>
    // Reverse device gate (2026-08-25, later still — see
    // DEVELOPMENT_PLAN.md Stage 14 / PRODUCT_REQUIREMENTS.md §19 for the
    // full decision writeup). The forward gate in the desktop
    // `index.html` sends narrow viewports here; this had no matching
    // reverse check at all, a known, disclosed gap. Deliberately NOT
    // keyed on viewport width alone, though — a phone rotated to
    // landscape can easily exceed 767px, and must NOT be sent to the
    // desktop scene on that basis: desktop's mouse-hover/parallax model
    // has no touch equivalent (this project decided mobile itself gets
    // no movement/hover equivalent, which is a separate question from
    // whether desktop's own model works on a touchscreen — it doesn't).
    // Gated on width AND `(hover: hover) and (pointer: fine)` — the same
    // primary-input media features this project's own desktop `main.js`
    // already uses for its cursor decision (`finePointerQuery`), reused
    // here for consistency rather than introducing a second detection
    // philosophy for the same underlying question ("is this a
    // mouse-driven device"). A touch-primary device never matches this,
    // landscape or not, regardless of width — only a genuine
    // mouse/trackpad-driven wide window redirects, which rescues the
    // one real gap this leaves open: a desktop user loading this page
    // (directly, or via the forward gate) with a narrow BROWSER WINDOW,
    // then widening it without a reload.
    //
    // Known, accepted imprecision (same tradeoff `finePointerQuery`
    // already carries on desktop): `pointer`/`hover` reflect the
    // PRIMARY input, so a touch+mouse hybrid device (e.g. a 2-in-1
    // laptop used via its touchscreen) can still match if its primary
    // input is classified as mouse/trackpad — not solved here, consistent
    // with how the existing desktop gate already treats that ambiguity.
    //
    // Checked once synchronously on load (mirroring the forward gate,
    // and closing the "deep-links directly into mobile/index.html stays
    // there" gap) AND live via the same 'change'-event + debounce pattern
    // as the forward gate, so a rotation/resize after load is caught too.
    // Returning to the Campus (2026-10-12): the opening is only for a
    // fresh entry. A browser Back/Forward to this page, or arriving from
    // one of the sub-sites (their "← Glonari" back link, or any link out of
    // meet-gia/, digital-banker/, global-dream/, global-reserve/), lands
    // straight in the Campus loop. Same-origin referrer only, so an outside
    // link still gets the opening, and a manual reload (which keeps the old
    // referrer) still shows it — unless it was already shown in this tab
    // (see `glonari.openingSeen` in the next script).
    function glonariReturningToCampus() {
      try {
        var nav = performance.getEntriesByType('navigation')[0];
        if (nav && nav.type === 'back_forward') return true;
        if ((nav && nav.type === 'reload') || !document.referrer) return false;
        var ref = new URL(document.referrer);
        return ref.origin === location.origin &&
          /\/(meet-gia|digital-banker|global-dream|global-reserve)\//.test(ref.pathname);
      } catch (e) {
        return false;
      }
    }

    // 2026-10-13: the width/aspect part is now the exact negation of the
    // desktop gate ('(max-width: 767px), not all and (min-aspect-ratio:
    // 3/2)') — at least 768px wide AND at least 3:2 — so a window the
    // desktop page would send here is never sent back (no redirect loop).
    // The (hover)/(pointer) part is unchanged.
    var desktopQuery = window.matchMedia('(min-width: 768px) and (min-aspect-ratio: 3/2) and (hover: hover) and (pointer: fine)');

    function goDesktop() {
      window.location.replace('../index.html');
    }

    if (desktopQuery.matches) {
      // Carry a returning visit's "skip the intro" over the .replace().
      if (glonariReturningToCampus()) sessionStorage.setItem('glonariSkipIntro', '1');
      goDesktop();
    } else {
      var pendingDesktopRedirect = null;
      desktopQuery.addEventListener('change', function (event) {
        if (pendingDesktopRedirect) {
          clearTimeout(pendingDesktopRedirect);
          pendingDesktopRedirect = null;
        }
        if (!event.matches) return;
        pendingDesktopRedirect = setTimeout(function () {
          if (desktopQuery.matches) {
            // One-shot marker consumed by desktop index.html's own inline
            // <head> script — this call site is the LIVE resize/orientation
            // redirect, not the initial synchronous check above, so the
            // destination page must not replay the opening video. Set
            // immediately before the existing goDesktop() call; goDesktop()
            // itself and the redirect criteria are unchanged.
            sessionStorage.setItem('glonariSkipIntro', '1');
            goDesktop();
          }
        }, 300);
      });
    }
  </script>
  <script>
    // Opening video (2026-10-14, DEVELOPMENT_PLAN.md Stage 20 /
    // PRODUCT_REQUIREMENTS.md §30): the same rules as the desktop
    // index.html. A fresh entry plays ../assets/campus/campus-opening.mp4
    // full screen straight away (no splash screen, no click), then hands
    // off to the loop — see main.js. `opening-pending` on <html> is what
    // makes styles.css show the opening layer (with its poster) from the
    // very first paint.
    //
    // It is skipped — straight into the loop — when:
    //  - the one-shot `glonariSkipIntro` marker is set: by the desktop
    //    page when it forwards a returning visit here, or by its live
    //    resize/orientation redirect (consumed here, once);
    //  - returning to the Campus (see glonariReturningToCampus above);
    //  - it was already shown in this tab's session: `glonari.openingSeen`,
    //    the same flag the desktop page sets and reads, so one showing per
    //    session covers both versions.
    //
    // Nothing here runs when the first script is already redirecting to
    // the desktop page (the marker it may have just set must survive).

    // sessionStorage can throw (storage blocked, some private modes); a
    // failure reads as "nothing stored" → behaves like a first visit.
    function glonariSession(method, key, value) {
      try {
        return sessionStorage[method](key, value);
      } catch (e) {
        return null;
      }
    }

    function glonariPreload(href, priority) {
      var link = document.createElement('link');
      link.rel = 'preload';
      link.as = 'image';
      link.href = href;
      if (priority) link.fetchPriority = priority;
      document.head.appendChild(link);
    }

    // Framing of the 16:9 Campus box on this screen (also used by main.js
    // on resize): it always fills the screen ("cover" — on a portrait
    // phone that means full height, with only part of the frame's width
    // visible). `minTx..0` is the horizontal pan range (never past the
    // frame's edges). `openingTx` is the fixed position during the
    // opening video and where the loop starts: the right edge of the
    // screen sits on the right edge of the globe's pedestal, so the globe
    // and pedestal are whole and everything left of them goes to Gia.
    var GLONARI_PEDESTAL_RIGHT = 752; // pedestal ends ≈ 745; a few units of air, in the zones' 1280x720 space
    function glonariCampusFrame(vw, vh) {
      var h = Math.max(vh, vw * 9 / 16);
      var w = h * 16 / 9;
      var minTx = Math.min(0, vw - w);
      var openingTx = Math.min(0, Math.max(minTx, vw - (GLONARI_PEDESTAL_RIGHT / 1280) * w));
      return { w: w, h: h, top: (vh - h) / 2, minTx: minTx, openingTx: openingTx };
    }

    if (!desktopQuery.matches) {
      if (glonariSession('getItem', 'glonariSkipIntro')) {
        glonariSession('removeItem', 'glonariSkipIntro');
      } else if (!glonariReturningToCampus() && glonariSession('getItem', 'glonari.openingSeen') !== '1') {
        document.documentElement.classList.add('opening-pending');
        glonariPreload('../assets/campus/campus-opening-poster.webp', 'high');
      }
      glonariPreload('../assets/campus/campus-still.webp');
    }
  </script>
  <title>Glonari — Global</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="../design-tokens.css" />
  <link rel="stylesheet" href="../section-modal.css" />
  <link rel="stylesheet" href="../campus-zones.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Mobile Campus (2026-10-14, DEVELOPMENT_PLAN.md Stage 20 /
       PRODUCT_REQUIREMENTS.md §30) — replaces the old branded intro
       overlay and the carousel of cut-out buildings. Same media and the
       same 11 hotspots as the desktop Campus: the opening video, the
       still, the loop and the SVG zones are children of ONE 16:9 box
       (.campus), which main.js moves sideways with a single transform.
       Nothing inside it moves on its own, so no layer can ever drift off
       another. -->
  <div class="stage-viewport" id="stage">
  <div class="campus" id="campus">
    <img class="campus__still" alt="" width="1920" height="1080" draggable="false">
    <video class="campus__loop" muted loop playsinline preload="auto" aria-hidden="true"></video>
    <video class="campus__opening" muted playsinline preload="auto" aria-hidden="true"></video>
    <script>
      // Media src/poster set here (as on desktop), only when this page is
      // staying on mobile, so a page that is redirecting to the desktop
      // fetches no video. The opening only on a fresh entry; otherwise its
      // element is dropped and its file never requested. The box is placed
      // at its opening position right away, before the first paint.
      (function (opening) {
        if (desktopQuery.matches) return;
        var campus = opening.parentNode;
        var stage = campus.parentNode;
        var loop = campus.querySelector('.campus__loop');
        var frame = glonariCampusFrame(stage.clientWidth, stage.clientHeight);
        campus.style.width = frame.w + 'px';
        campus.style.height = frame.h + 'px';
        campus.style.transform = 'translate3d(' + frame.openingTx + 'px,' + frame.top + 'px,0)';
        campus.querySelector('.campus__still').src = '../assets/campus/campus-still.webp';
        loop.poster = '../assets/campus/campus-still.webp';
        loop.src = '../assets/campus/campus-loop.mp4';
        if (document.documentElement.classList.contains('opening-pending')) {
          opening.poster = '../assets/campus/campus-opening-poster.webp';
          opening.src = '../assets/campus/campus-opening.mp4';
        } else {
          opening.remove();
        }
      })(document.currentScript.previousElementSibling);
    </script>
    <!-- The 11 hotspots: written here by the shared campus-zones.js (the
         same shapes, masks and order as the desktop page). -->
    <script src="../campus-zones.js" data-base="../"></script>
  </div>
  </div>

  <!-- Name tag of the tapped zone. Tapping it does what a click does on
       desktop (section modal or the black-fade jump to a sub-site). -->
  <button class="campus__tag" type="button" tabindex="-1" aria-hidden="true">
    <span class="campus__tag-name"></span><span class="campus__tag-arrow" aria-hidden="true">→</span>
  </button>

  <!-- Edge plates: the nearest building beyond each screen edge; a tap
       glides the Campus over to it. Hidden when nothing is beyond. -->
  <button class="campus__edge campus__edge--left" type="button" tabindex="-1">
    <span class="campus__edge-arrow" aria-hidden="true">←</span><span class="campus__edge-name"></span>
  </button>
  <button class="campus__edge campus__edge--right" type="button" tabindex="-1">
    <span class="campus__edge-name"></span><span class="campus__edge-arrow" aria-hidden="true">→</span>
  </button>

  <!-- Same #modal-overlay/#modal-card markup as desktop's index.html —
       required as-is by the shared section-modal.js/section-modal.css —
       plus a corner × (mobile only; wired in main.js). -->
  <div id="modal-overlay">
    <div id="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-desc">
      <button class="modal-x" type="button" aria-label="Close">×</button>
      <h2 id="modal-title"></h2>
      <p id="modal-desc"></p>
      <button id="modal-close" type="button">Close</button>
    </div>
  </div>

  <!-- Cross-project navigation fade (Digital Banker, Meet Gia). -->
  <div id="exit-transition" aria-hidden="true"></div>

  <script src="../section-modal.js" defer></script>
  <script src="main.js" defer></script>
</body>
</html>
